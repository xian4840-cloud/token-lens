appId: app.tokenlens.desktop
productName: Token Lens
artifactName: TokenLens-Setup-${version}-${arch}.${ext}
directories:
  output: dist-electron
files:
  - electron-dist/**
  - "!electron-dist/**/*.map"
  - ui/dist/**
  - package.json
  - electron/codex-capture/*.cs
  - electron/agent-capture/*.mjs
  - electron/agent-capture/*.cjs
asar: true
electronLanguages:
  - zh-CN
  - en-US
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Token Lens
  uninstallDisplayName: Token Lens
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # 卸载时清理「响应核验」写到应用目录之外的文件与 BUN_OPTIONS（见脚本内说明）
  include: build/installer.nsh
